name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'The Remotion Composition ID to render'
        required: true
        default: 'EvolutionShort'

jobs:
  render:
    name: Render video on cloud (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render video with Remotion
        run: npx remotion render ${{ github.event.inputs.composition_id }} out/video.mp4 --scale 1.3333

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-short-output
          path: out/video.mp4
